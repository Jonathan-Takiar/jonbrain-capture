<!doctype html>
<html lang="he" dir="rtl">
<head>
<script>window.__t0 = performance.now();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0f14">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JonBrain · קליטה</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#151822; --line:#252a38; --text:#ece9f5; --muted:#8a8fa3;
    --accent:#7c5cff; --accent2:#4fd6e0; --ok:#5fe0a8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif}
  body{overscroll-behavior:none}
  .view{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 12px)}
  [hidden]{display:none!important}

  /* capture */
  #capture::before{content:"";position:absolute;inset:-20% -20% auto;height:60%;pointer-events:none;
    background:radial-gradient(closest-side,rgba(124,92,255,.18),transparent);filter:blur(10px)}
  .top{display:flex;align-items:center;justify-content:space-between;height:44px;font-size:13px;color:var(--muted);position:relative}
  .brand{display:flex;align-items:center;gap:8px;letter-spacing:.3px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .dot.off{background:#e0a45f;box-shadow:0 0 10px #e0a45f}
  #in{flex:1;width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--text);
    font:inherit;font-size:22px;line-height:1.5;padding:8px 2px;position:relative;caret-color:var(--accent2)}
  #in::placeholder{color:#555b70}
  .shared{font-size:13px;color:var(--accent2);background:rgba(79,214,224,.08);border:1px solid rgba(79,214,224,.25);
    border-radius:10px;padding:8px 10px;margin:4px 0;word-break:break-all;white-space:pre-line}
  .bar{display:flex;gap:10px;align-items:center;padding-top:8px}
  button{font:inherit;border:0;cursor:pointer}
  #save{flex:1;height:52px;border-radius:16px;color:#fff;font-size:18px;font-weight:600;
    background:linear-gradient(135deg,var(--accent),#5a7bff);box-shadow:0 6px 24px rgba(124,92,255,.35);transition:transform .08s}
  #save:active{transform:scale(.97)}
  #save:disabled{opacity:.35;box-shadow:none}
  #listBtn{height:52px;padding:0 16px;border-radius:16px;background:var(--panel);color:var(--muted);border:1px solid var(--line);font-size:15px}
  #toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;
    color:var(--ok);font-size:18px;font-weight:600;transition:opacity .25s,transform .25s;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .pulse{position:fixed;left:50%;top:40%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
    border:2px solid var(--accent2);pointer-events:none;animation:pulse .7s ease-out forwards}
  @keyframes pulse{to{transform:scale(14);opacity:0}}

  /* list */
  #list{overflow:auto;padding-top:calc(env(safe-area-inset-top) + 8px)}
  .lhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .lhead h1{font-size:18px;margin:0 0 0 auto}
  .btn{height:40px;padding:0 14px;border-radius:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);font-size:14px}
  .btn.primary{background:var(--accent);border-color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .item .meta{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;gap:8px}
  .item .txt{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.45}
  .tag{font-size:11px;padding:1px 7px;border-radius:8px;background:rgba(79,214,224,.12);color:var(--accent2)}
  .metrics{font-size:13px;color:var(--muted);line-height:1.7}
  .metrics b{color:var(--text);font-weight:600}
  .metrics table{width:100%;border-collapse:collapse;margin-top:6px}
  .metrics td,.metrics th{text-align:start;padding:3px 4px;border-bottom:1px solid var(--line);font-weight:400}
  .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>

<main id="capture" class="view">
  <div class="top">
    <div class="brand"><span id="net" class="dot"></span>JonBrain</div>
    <div id="hint"></div>
  </div>
  <div id="sharedBox" class="shared" hidden></div>
  <textarea id="in" autofocus enterkeyhint="enter" autocomplete="off" autocorrect="on" spellcheck="true"
    placeholder="מה עובר לך בראש?"></textarea>
  <div class="bar">
    <button id="listBtn" type="button">נקלטו <span id="count" class="num">0</span></button>
    <button id="save" type="button" disabled>לזרוק למוח</button>
  </div>
  <div id="toast">נקלט</div>
</main>

<section id="list" class="view" hidden>
  <div class="lhead">
    <button class="btn" id="back" type="button">→ חזרה</button>
    <h1>מה נקלט</h1>
  </div>
  <div class="lhead">
    <button class="btn primary" id="copyAll" type="button">העתק הכול</button>
    <button class="btn" id="export" type="button">ייצוא קובץ</button>
  </div>
  <div class="card metrics" id="metrics"></div>
  <div id="items"></div>
</section>

<script>
(() => {
  // ---------- storage (local, prototype only) ----------
  const K_CAP = 'jb.captures.v1', K_MET = 'jb.metrics.v1';
  const load = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
  let captures = load(K_CAP), metrics = load(K_MET);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

  const $ = id => document.getElementById(id);
  const input = $('in'), saveBtn = $('save');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  // ---------- time-to-type measurement ----------
  // session = one launch (cold/navigation) or one resume (app back from background)
  let session = null;
  function startSession(kind, t0) {
    session = {
      id: uid(), kind, at: new Date().toISOString(), standalone,
      online: navigator.onLine,
      swControlled: !!(navigator.serviceWorker && navigator.serviceWorker.controller),
      src: (() => { const q = new URLSearchParams(location.search);
        if (kind === 'resume') return 'resume';
        if (q.get('text') || q.get('url') || q.get('title')) return 'share';
        return q.get('src') || 'other'; })(),
      focusMs: null, keyboardMs: null, firstKeyMs: null, saveMs: null, t0
    };
    metrics.push(session);
    if (metrics.length > 500) metrics = metrics.slice(-500);
    persistMetrics();
  }
  const since = () => Math.round(performance.now() - session.t0);
  const persistMetrics = () => store(K_MET, metrics.map(({ t0, ...m }) => m));

  function focusInput() {
    input.focus({ preventScroll: true });
    const n = input.value.length; try { input.setSelectionRange(n, n); } catch {}
    if (session && session.focusMs == null && document.activeElement === input) { session.focusMs = since(); persistMetrics(); }
  }

  // keyboard detection: visual viewport shrinks well below screen height
  const vv = window.visualViewport;
  function checkKeyboard() {
    if (!session || session.keyboardMs != null || !vv) return;
    const full = Math.max(window.screen.height, window.outerHeight || 0);
    if (vv.height < full * 0.72) { session.keyboardMs = since(); persistMetrics(); updateHint(); }
  }
  vv && vv.addEventListener('resize', checkKeyboard);

  function updateHint() {
    const h = $('hint');
    if (!session) return;
    h.textContent = session.keyboardMs != null ? `מוכן · ${session.keyboardMs}ms` : '';
  }

  // cold / navigation launch
  startSession('launch', window.__t0 != null ? 0 : performance.now());
  // __t0 ~ first script; measure from navigation start (performance time origin = 0)

  // warm resume
  let wasHidden = false;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { wasHidden = true; return; }
    if (wasHidden) { wasHidden = false; startSession('resume', performance.now()); focusInput(); requestAnimationFrame(checkKeyboard); }
  });
  window.addEventListener('pageshow', e => { if (e.persisted) { startSession('resume', performance.now()); focusInput(); } });

  // ---------- share target ----------
  let pendingShareId = null;
  (function handleShare() {
    const p = new URLSearchParams(location.search);
    const parts = [p.get('title'), p.get('text'), p.get('url')].filter(Boolean);
    if (!parts.length) return;
    // de-dup: some apps put the URL inside text as well
    const text = [...new Set(parts.map(s => s.trim()))].join('\n');
    const item = { id: uid(), text, createdAt: new Date().toISOString(), source: 'share', online: navigator.onLine };
    captures.push(item); store(K_CAP, captures);           // preserved immediately, nothing to lose
    pendingShareId = item.id;
    const box = $('sharedBox'); box.hidden = false;
    box.textContent = '✓ נשמר במוח: ' + (p.get('url') || text).slice(0, 140) + '\nאפשר להוסיף מחשבה, או פשוט לסגור';
    input.placeholder = 'למה שמרת את זה? (לא חובה)';
    history.replaceState(null, '', location.pathname + '?src=share');
    flash('נשמר');
  })();

  // ---------- capture ----------
  function refreshCount() { $('count').textContent = captures.length; }
  function syncBtn() {
    const has = !!input.value.trim();
    saveBtn.disabled = !has && !pendingShareId;
    saveBtn.textContent = (!has && pendingShareId) ? 'סיום ✓' : 'לזרוק למוח';
  }
  input.addEventListener('input', () => {
    syncBtn();
    if (session && session.firstKeyMs == null) { session.firstKeyMs = since(); persistMetrics(); }
  });

  function endShare() {
    pendingShareId = null;
    $('sharedBox').hidden = true; input.placeholder = 'מה עובר לך בראש?';
    syncBtn(); focusInput();
  }
  function save() {
    const text = input.value.trim();
    if (!text) { if (pendingShareId) endShare(); return; }
    const item = { id: uid(), text, createdAt: new Date().toISOString(), source: 'typed', online: navigator.onLine };
    if (pendingShareId) { item.relatedTo = pendingShareId; pendingShareId = null; }
    captures.push(item);
    const ok = store(K_CAP, captures);
    if (session && session.saveMs == null) { session.saveMs = since(); persistMetrics(); }
    input.value = '';
    $('sharedBox').hidden = true; input.placeholder = 'מה עובר לך בראש?';
    refreshCount();
    flash(ok ? 'נקלט' : 'שגיאת שמירה — העתק את הטקסט!');
    if (!ok) { input.value = text; }
    syncBtn();
    focusInput();
  }
  saveBtn.addEventListener('click', save);
  saveBtn.addEventListener('pointerdown', e => e.preventDefault()); // keep keyboard open
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } });

  function flash(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    const p = document.createElement('div'); p.className = 'pulse'; document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
    setTimeout(() => t.classList.remove('show'), 900);
  }

  // tapping anywhere on the capture view focuses the input
  $('capture').addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') focusInput(); });

  // ---------- list view ----------
  const fmt = iso => new Date(iso).toLocaleString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2); }
  function renderMetrics() {
    const row = (label, list) => {
      const fo = list.map(m => m.focusMs).filter(v => v != null);
      const k = list.map(m => m.keyboardMs).filter(v => v != null);
      const f = list.map(m => m.firstKeyMs).filter(v => v != null);
      const cell = v => v == null ? '—' : `<span class="num">${v}ms</span>`;
      return `<tr><td>${label}</td><td class="num">${list.length}</td><td>${cell(median(fo))}</td><td>${cell(median(k))}</td><td>${cell(median(f))}</td></tr>`;
    };
    const L = metrics.filter(m => m.kind === 'launch'), R = metrics.filter(m => m.kind === 'resume');
    const offline = metrics.filter(m => !m.online).length;
    $('metrics').innerHTML =
      `<b>מדידת זמן עד הקלדה</b> (חציון)` +
      `<table><tr><th></th><th>פתיחות</th><th>שדה מוכן</th><th>מקלדת פתוחה</th><th>הקשה ראשונה</th></tr>` +
      row('פתיחה מלאה', L) + row('חזרה מהרקע', R) + `</table>` +
      `<div>אופליין: <span class="num">${offline}</span> · מותקן כאפליקציה: ${standalone ? 'כן' : 'לא'}</div>`;
  }
  function renderList() {
    const items = [...captures].reverse();
    $('items').innerHTML = items.length ? items.map(c => `
      <div class="card item">
        <div class="meta"><span class="num">${fmt(c.createdAt)}</span>${c.source === 'share' ? '<span class="tag">שיתוף</span>' : ''}${c.relatedTo ? '<span class="tag">מחשבה על שיתוף</span>' : ''}</div>
        <div class="txt">${esc(c.text)}</div>
      </div>`).join('') : '<div class="empty">עוד לא נקלט כלום</div>';
    renderMetrics();
  }
  $('listBtn').addEventListener('click', () => { $('capture').hidden = true; $('list').hidden = false; renderList(); });
  $('back').addEventListener('click', () => { $('list').hidden = true; $('capture').hidden = false; focusInput(); });

  function asText() {
    return captures.map(c => `[${fmt(c.createdAt)}]${c.source === 'share' ? ' (שיתוף)' : ''} ${c.text}`).join('\n\n');
  }
  $('copyAll').addEventListener('click', async () => {
    const t = asText();
    try { await navigator.clipboard.writeText(t); }
    catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    $('copyAll').textContent = 'הועתק ✓'; setTimeout(() => $('copyAll').textContent = 'העתק הכול', 1500);
  });
  $('export').addEventListener('click', () => {
    const data = { exportedAt: new Date().toISOString(), captures, metrics: metrics.map(({ t0, ...m }) => m) };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = `jonbrain-capture-${new Date().toISOString().slice(0, 10)}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  // ---------- network ----------
  const net = () => $('net').classList.toggle('off', !navigator.onLine);
  addEventListener('online', net); addEventListener('offline', net); net();

  // ---------- boot ----------
  refreshCount();
  syncBtn();
  focusInput();
  requestAnimationFrame(() => { focusInput(); checkKeyboard(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
